name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, test, build, package checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      # pnpm 11 needs Node >= 22.13; Next 16 needs >= 20.9.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm turbo lint typecheck test build

      # publint, attw and the packed-file check, against the built package;
      # plus the Vite app's off-build check (no `data-themer` in its dist).
      - run: pnpm turbo check:package

  e2e:
    name: E2E (Playwright, Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Browser version follows the @playwright/test pin in apps/vite.
      - run: pnpm --filter vite-app exec playwright install --with-deps chromium

      - run: pnpm turbo e2e

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/*/playwright-report
          retention-days: 7

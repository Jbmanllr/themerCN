name: Release

# Changesets release flow (README "Releasing"). On every push to main:
# - pending changesets: open or update the "Version Packages" PR;
# - no changesets and an unpublished themercn version (that PR was merged):
#   build and pack it, then publish it to npm `latest` with trusted publishing
#   (OIDC, automatic provenance, no NPM_TOKEN), push the tag and create the
#   GitHub Release.
# Only the publish job can mint an OIDC token. npm matches this file's name
# (release.yml) against the package's trusted publisher: don't rename it.

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  select-mode:
    name: Select mode
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      # No dependency cache in this workflow: it guards against cache
      # poisoning reaching the publish job.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: pnpm install --frozen-lockfile

      - id: select-mode
        uses: changesets/action/select-mode@v2

  version:
    name: Version Packages PR
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'version'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: pnpm install --frozen-lockfile

      # Runs `changeset version` (CHANGELOG via @changesets/changelog-github)
      # and opens or updates the "Version Packages" PR.
      - uses: changesets/action/version@v2

  pack:
    name: Build and pack
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: pnpm install --frozen-lockfile

      # Builds themercn and runs publint, attw and the packed-file check.
      - run: pnpm turbo check:package

      # `pnpm pack`, which rewrites `workspace:*` ranges in the manifest.
      - id: pack
        uses: changesets/action/pack@v2
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

  publish:
    name: Publish to npm
    needs: pack
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the tag, create the GitHub Release
      id-token: write # npm trusted publishing
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      # Trusted publishing needs Node >= 22.14.0 and npm >= 11.5.1
      # (publish-packed.mjs checks both). No registry-url: npm exchanges the
      # OIDC token itself.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: npm install -g npm@^11.5.1

      # Only the changeset CLI is needed here; no lifecycle scripts run in the
      # job that holds the OIDC token.
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.pack.outputs.pack-dir-artifact-id }}
          path: ${{ runner.temp }}/changeset-pack

      # publish-packed.mjs runs `npm publish <tarball>` for each packed
      # release, then `changeset git-tag`; the action pushes those tags and
      # creates the GitHub Releases.
      - uses: changesets/action/publish@v2
        with:
          script: node packages/themer/scripts/publish-packed.mjs
        env:
          PACK_DIR: ${{ runner.temp }}/changeset-pack

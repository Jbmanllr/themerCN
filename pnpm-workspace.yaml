packages:
  - "apps/*"
  - "packages/*"

# One version for each runtime dependency packages/ui and themercn share:
# packages/ui is type-checked against what themercn ships with (its
# components are bundled into themercn's dist).
catalog:
  "@base-ui/react": ^1.9.0
  class-variance-authority: ^0.7.1
  cmdk: ^1.1.1
  cn: ^0.4.0
  lucide-react: 1.56.0
  react-day-picker: 10.0.2
  react-resizable-panels: 4.14.5
  recharts: 3.10.1

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
  msw: false
